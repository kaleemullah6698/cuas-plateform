# Operator console static hosting + gateway reverse proxy (ARCHITECTURE.md §4.1.1, §8.2).
#
# The browser talks only to this origin: the SPA is served here, and /api and /ws are proxied to the
# API gateway — which is the single ingress that authenticates, rate-limits and fans out. Keeping the
# browser same-origin is what lets config.ts derive the API and WS URLs from window.location.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes (e.g. /ops/tracks) fall back to the SPA entry point.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST — auth, and any future gateway-routed API.
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket fan-out (§3.5): the upgrade needs the connection/upgrade headers and a long read timeout.
  location /ws {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
}
