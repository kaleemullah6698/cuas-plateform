# CUAS platform — development topology (ARCHITECTURE.md section 8.2)
#
# Profiles:
#   infra          infrastructure only
#   platform       + Track A services
#   ai             + Track B AI services
#   observability  Prometheus + Grafana + Loki + Tempo (§8.6)
#
#   docker compose --profile infra up -d
#   docker compose --profile platform up -d
#   docker compose --profile observability up -d
#   AI_PROVIDER_MODE=mock docker compose --profile platform up -d
#
# Infrastructure services are configured for a working first-run (KRaft Kafka with advertised
# listeners, health checks, host port mappings, and the init scripts mounted). Platform service
# wiring was completed at M11, when the whole stack was first run together.

x-service-defaults: &defaults
  restart: unless-stopped
  networks: [cuas-internal]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

# The infrastructure every Track A service needs (M11). Each service's application.yml defaults
# these to localhost, which is correct when running one service from an IDE and wrong inside a
# container — localhost there is the service itself. Declaring them once avoids the failure mode
# where a service is added to compose, starts cleanly, and quietly talks to nothing.
x-platform-env: &platform-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-cuas}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Every service is a resource server. JWKS is fetched once and cached; no service calls
  # auth-service per request.
  AUTH_JWKS_URI: http://auth-service:8081/auth/jwks

services:
  # ── Infrastructure ──────────────────────────────────────────────────
  postgres:
    <<: *defaults
    profiles: [infra, platform, ai]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cuas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuas}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first initialisation: creates the ten per-service databases.
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cuas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    <<: *defaults
    profiles: [infra, platform, ai]
    image: confluentinc/cp-kafka:7.8.0
    environment:
      # ── KRaft single-node (no ZooKeeper) ──
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client listeners: PLAINTEXT for in-network services (kafka:9092),
      # PLAINTEXT_HOST for host tooling and manual testing (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
      # create-topics.sh is mounted so it can be run with: docker compose exec kafka bash /scripts/create-topics.sh
      - ./infrastructure/kafka:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  schema-registry:
    <<: *defaults
    profiles: [infra, platform, ai]
    image: confluentinc/cp-schema-registry:7.8.0
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    # Host 8081 belongs to auth-service (section 4.1.2); binding it here made the platform
    # unstartable — "Bind for 0.0.0.0:8081 failed: port is already allocated" — with whichever
    # container happened to come up first winning. Schema Registry keeps its own 8081 inside the
    # network, where the conflict does not exist, and is published on 8181 for the rare occasion
    # somebody wants to browse /subjects from the host.
    #
    # Nothing on the platform actually talks to it: the services serialise raw Protobuf and use
    # ByteArraySerializer, so no producer or consumer resolves a schema through it. It stays in the
    # topology because section 5.4 specifies it for the Avro/Protobuf registry path.
    ports: ["8181:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  elasticsearch:
    <<: *defaults
    profiles: [infra, platform, ai]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      # Security is disabled for the development profile only, to keep first-run and health
      # checks unauthenticated. Production re-enables xpack.security per ARCHITECTURE.md 7.9.
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    # Readiness is polled from the host on the mapped 9200 port (scripts/verify-infra.sh),
    # avoiding an assumption about which HTTP client the image bundles.

  kibana:
    <<: *defaults
    profiles: [infra]
    image: docker.elastic.co/kibana/kibana:8.17.0
    depends_on:
      elasticsearch: {condition: service_started}
    ports: ["5601:5601"]

  redis:
    <<: *defaults
    profiles: [infra, platform, ai]
    image: redis:7.4-alpine
    # Authenticated, per ARCHITECTURE.md section 8.2. Redis holds the gateway's rate-limit buckets
    # and the section 7.3 revocation denylist, so anyone able to reach it unauthenticated could
    # refill a bucket or clear a revocation.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    <<: *defaults
    profiles: [infra, platform, ai]
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9090:9090"]
    volumes: [miniodata:/data]
    # Readiness is polled from the host on the mapped 9000 port (scripts/verify-infra.sh).

  # ── Platform services (Track A) ─────────────────────────────────────
  api-gateway:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    depends_on:
      kafka: {condition: service_started}
      redis: {condition: service_healthy}
      auth-service: {condition: service_started}
    ports: ["8080:8080"]
    environment:
      # Redis holds the section 7.8 token buckets and the section 7.3 revocation denylist. The
      # gateway fails closed without it, which is why it waits for a healthy Redis rather than a
      # started one.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # JWKS is fetched once and cached; the gateway never calls auth-service per request.
      AUTH_JWKS_URI: http://auth-service:8081/auth/jwks
      # The routing table (section 4.1.1). Completed at M11: every operator-facing service is now
      # reachable through the gateway under /api/v1, closing finding G-4. The gateway does not wait
      # on these in depends_on — an unroutable upstream is a 503 on one screen, whereas making the
      # edge wait for eleven services would mean nobody can even sign in until the slowest is up.
      AUTH_SERVICE_URI: http://auth-service:8081
      USER_SERVICE_URI: http://user-service:8082
      AUDIT_SERVICE_URI: http://audit-service:8090
      TRACK_SERVICE_URI: http://track-correlation:8084
      THREAT_SERVICE_URI: http://threat-assessment:8086
      ALERT_SERVICE_URI: http://alert-service:8087
      NOTIFICATION_SERVICE_URI: http://notification-service:8088
      REPORTING_SERVICE_URI: http://reporting-service:8089
      CONFIG_SERVICE_URI: http://config-service:8091
      AI_ORCHESTRATOR_URI: http://ai-orchestrator:8085
      GATEWAY_ALLOWED_ORIGINS: http://localhost:3000
      # The browser reaches the SPA on :3000 and the gateway proxies /ws for it; without an allowed
      # origin the upgrade is refused and the console shows a permanent "connection lost" banner.
      GATEWAY_WS_ALLOWED_ORIGINS: http://localhost:3000

  # The first-administrator bootstrap (M11). Both services bind the same identity and each seeds
  # its own half — auth-service the credential, user-service the identity and its ADMIN role —
  # because neither may write to the other's database. Off unless CUAS_BOOTSTRAP_ADMIN_ENABLED is
  # set, and auth-service refuses to start if it is enabled without a password: there is
  # deliberately no default one (section 7.7).
  auth-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      <<: *platform-env
      # auth-service proves who a caller is; user-service decides what they may do, over gRPC
      # (section 4.1.2/4.1.3). Without this the call goes to the service's own loopback and every
      # login returns 500 — "UNAVAILABLE: finishConnect(..) failed: Connection refused
      # localhost/[0:0:0:0:0:0:0:1]:9082" — which reads as a broken credential rather than a
      # missing address.
      USER_SERVICE_HOST: user-service
      USER_SERVICE_GRPC_PORT: "9082"
      # The refresh cookie is Secure by default and must stay so anywhere the service is reachable
      # over a network (section 7.3). The local acceptance stack is plain HTTP on localhost, where a
      # Secure cookie is never returned by the browser, so the session could not be restored.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CUAS_BOOTSTRAP_ADMIN_ENABLED: ${CUAS_BOOTSTRAP_ADMIN_ENABLED:-false}
      CUAS_BOOTSTRAP_ADMIN_USERNAME: ${CUAS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CUAS_BOOTSTRAP_ADMIN_PASSWORD: ${CUAS_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      user-service: {condition: service_started}
  user-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    ports: ["8082:8082", "9082:9082"]
    environment:
      <<: *platform-env
      CUAS_BOOTSTRAP_ADMIN_ENABLED: ${CUAS_BOOTSTRAP_ADMIN_ENABLED:-false}
      CUAS_BOOTSTRAP_ADMIN_USERNAME: ${CUAS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CUAS_BOOTSTRAP_ADMIN_EMAIL: ${CUAS_BOOTSTRAP_ADMIN_EMAIL:-admin@cuas.local}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
  sensor-ingestion:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/sensor-ingestion/Dockerfile
    ports: ["8083:8083", "9083:9083"]
    environment:
      <<: *platform-env
      # Redis holds the section 4.1.4 dedup window and the per-sensor clock-drift state.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Dataset replay is a development aid; enable it explicitly, never in a sensor-facing deployment.
      INGESTION_REPLAY_ENABLED: ${INGESTION_REPLAY_ENABLED:-false}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_healthy}

  # Development sensor adapter. Not started with the platform; run it on demand:
  #   docker compose --profile sim run --rm sensor-simulator
  # It boots, drives the real ingestion intake, and exits (restart: no).
  sensor-simulator:
    <<: *defaults
    profiles: [sim]
    restart: "no"
    build:
      context: .
      dockerfile: backend/sensor-simulator/Dockerfile
    environment:
      INGEST_REST_URL: http://sensor-ingestion:8083
      INGEST_GRPC_HOST: sensor-ingestion
      INGEST_GRPC_PORT: "9083"
      SIMULATOR_TRANSPORT: ${SIMULATOR_TRANSPORT:-BOTH}
      SIMULATOR_RUN_ON_STARTUP: "true"
    depends_on:
      sensor-ingestion: {condition: service_started}

  track-correlation:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/track-correlation/Dockerfile
    ports: ["8084:8084", "9084:9084"]
    environment:
      <<: *platform-env
      # Hot in-flight track state (section 4.1.5). A miss costs latency, never correctness — but
      # without this the service would look for Redis on its own loopback and take that cost on
      # every detection.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # The circuit-broken Infer call (sections 4.1.5, 6.5). Without it the breaker opens against
      # the service's own loopback, every track stays unclassified, and the threat score loses the
      # 0.40-weight model-confidence factor — so nothing ever reaches the alert threshold. The
      # pipeline would look healthy and produce no alerts.
      AI_ORCHESTRATOR_ENDPOINT: ai-orchestrator:9085
      # A protected asset, so CPA is computed and proximity/closing/intent are evaluable (section
      # 6.3.4). With none configured, four of the five scoring factors are permanently absent and
      # every score rests on model confidence alone — reported as unreliable, and a demonstration
      # of the pipeline that never shows what it is for. Section 4.1.12 gives assets to
      # config-service; until then they are configured here and read through the
      # ProtectedAssetRegistry port. Co-located with the simulator's replay origin.
      CORRELATION_ASSETS_0_ID: ${PROTECTED_ASSET_ID:-SITE-1}
      CORRELATION_ASSETS_0_NAME: ${PROTECTED_ASSET_NAME:-Primary Site}
      CORRELATION_ASSETS_0_LATITUDE: ${PROTECTED_ASSET_LAT:-33.6844}
      CORRELATION_ASSETS_0_LONGITUDE: ${PROTECTED_ASSET_LON:-73.0479}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_healthy}
  ai-orchestrator:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/ai-orchestrator/Dockerfile
    ports: ["8085:8085", "9085:9085"]
    environment:
      <<: *platform-env
      # The AI service registry (section 6.3). The default profile registers services: {} on
      # purpose — a registry shipped in the default profile would be registered in every deployment
      # including production, which is the configuration-level version of mistaking a mock for a
      # real model. The worked four-service registry lives in the dev profile, and this is the
      # deployment that wants it: without activating it the registry is empty, every Infer routes
      # nowhere and returns INSUFFICIENT_DATA, no track is ever classified, and the threat score
      # silently loses its 0.40-weight factor. Nothing errors; there are simply no alerts.
      SPRING_PROFILES_ACTIVE: ${AI_ORCHESTRATOR_PROFILE:-dev}
      # The content-addressed inference cache (section 4.1.6).
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # The orchestrator owns no database; the shared block's Postgres entries are harmless and
      # keeping one block for every service is worth more than trimming two variables here.
    depends_on:
      kafka: {condition: service_started}
      redis: {condition: service_healthy}
  threat-assessment:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/threat-assessment/Dockerfile
    ports: ["8086:8086"]
    environment:
      <<: *platform-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
  alert-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/alert-service/Dockerfile
    ports: ["8087:8087"]
    environment:
      <<: *platform-env
      # The escalation sorted set and the leader lease (section 4.1.8). Unlike the caches above,
      # this one is load-bearing: without it no unacknowledged alert ever escalates.
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
      redis: {condition: service_healthy}
  notification-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
    ports: ["8088:8088"]
    environment:
      <<: *platform-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
  reporting-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/reporting-service/Dockerfile
    ports: ["8089:8089"]
    environment:
      <<: *platform-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
  audit-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/audit-service/Dockerfile
    ports: ["8090:8090"]
    environment:
      <<: *platform-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
  config-service:
    <<: *defaults
    profiles: [platform]
    build:
      context: .
      dockerfile: backend/config-service/Dockerfile
    ports: ["8091:8091", "9091:9091"]
    environment:
      <<: *platform-env
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}

  # ── Frontend ────────────────────────────────────────────────────────
  web:
    <<: *defaults
    profiles: [platform]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]

  # ── AI services (Track B) ───────────────────────────────────────────
  rf-classifier:
    <<: *defaults
    profiles: [ai]
    build:
      context: ./ai-services/rf-classifier
      dockerfile: Dockerfile
  vision-detector:
    <<: *defaults
    profiles: [ai]
    build:
      context: ./ai-services/vision-detector
      dockerfile: Dockerfile
  radar-rf-fusion:
    <<: *defaults
    profiles: [ai]
    build:
      context: ./ai-services/radar-rf-fusion
      dockerfile: Dockerfile
  threat-scorer:
    <<: *defaults
    profiles: [ai]
    build:
      context: ./ai-services/threat-scorer
      dockerfile: Dockerfile

  # ── Observability (ARCHITECTURE.md §8.6) — `docker compose --profile observability up -d` ──
  prometheus:
    <<: *defaults
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus

  loki:
    <<: *defaults
    profiles: [observability]
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports: ["3100:3100"]
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki

  tempo:
    <<: *defaults
    profiles: [observability]
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./infrastructure/monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempodata:/var/tempo

  grafana:
    <<: *defaults
    profiles: [observability]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

networks:
  cuas-internal:
    driver: bridge

volumes:
  pgdata:
  kafkadata:
  esdata:
  redisdata:
  miniodata:
  promdata:
  lokidata:
  tempodata:
  grafanadata:
