version: v2

# Generated bindings for the three consuming languages (ARCHITECTURE.md sections 4, 3, 6).
# Output under generated/ is build output: git-ignored, never hand-edited, regenerated by
# `buf generate`. Java and Python plugin versions are pinned to match the runtime versions
# declared elsewhere (protobuf 4.29.2 / protoc v29.2; gRPC 1.69.0), so generated code and
# runtime never drift apart.
plugins:
  # ── Java: messages + gRPC stubs ──
  - remote: buf.build/protocolbuffers/java:v29.2
    out: generated/java
  - remote: buf.build/grpc/java:v1.69.0
    out: generated/java

  # ── Python: messages, type stubs, and gRPC stubs ──
  - remote: buf.build/protocolbuffers/python:v29.2
    out: generated/python
  - remote: buf.build/protocolbuffers/pyi:v29.2
    out: generated/python
  - remote: buf.build/grpc/python:v1.69.0
    out: generated/python

  # ── TypeScript: protobuf-es v2 message types ──
  - remote: buf.build/bufbuild/es
    out: generated/typescript
    opt:
      - target=ts
