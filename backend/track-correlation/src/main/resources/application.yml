# track-correlation — ARCHITECTURE.md section 4.1.5
#
# Consumes sensor.detection.normalized.v1, associates each detection into a track, and publishes
# track.created.v1 / track.updated.v1. Owns trackdb. (Redis hot-state and the gRPC SubscribeTracks
# stream are deferred to later M5 sub-milestones.)

spring:
  application:
    name: track-correlation

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/trackdb
    username: ${POSTGRES_USER:cuas}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate validates against it and never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Hot in-flight track state (section 4.1.5). Section 7.2 requires TLS + AUTH with a per-service
  # password in production; the password comes from the environment and is never in source.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: track-correlation
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      properties:
        max.poll.records: 200
        max.poll.interval.ms: 300000

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/jwks}

# Association and lifecycle tunables (see CorrelationProperties). Left at their defaults here.
correlation:
  association:
    distance-gate-m: 500
  confirmation:
    threshold: 3
  sector:
    cell-degrees: 1.0
  kalman:
    process-noise: 1.0
    measurement-noise: 25.0
    initial-position-variance: 100.0
    initial-velocity-variance: 100.0
    initial-acceleration-variance: 10.0
  lifecycle:
    coast-timeout: PT10S
    lost-timeout: PT30S
    check-interval: PT5S
  prediction:
    horizon: PT30S
    step: PT5S
  # Hot in-flight state (section 4.1.5). A cache in front of the per-detection candidate query;
  # PostgreSQL stays the source of truth, so a miss or an unreachable Redis costs latency, never
  # correctness. Set to false to run without Redis at all.
  hot-state:
    enabled: ${CORRELATION_HOT_STATE_ENABLED:true}
  merge:
    gate-m: 150
    required-consecutive-sweeps: 3
    check-interval: PT5S
  # Protected assets for CPA. ARCHITECTURE.md section 4.1.12 assigns these to the Configuration
  # Service; until it exists (M8) they are configured here and read through the
  # ProtectedAssetRegistry port. Empty by default — with no asset configured no CPA is published,
  # which is the honest outcome rather than a fabricated default.
  assets: []

server:
  port: 8084

# TrackService.SubscribeTracks (section 4.1.5). Section 7.2 protects this surface with mTLS
# workload identity, as it does the other inter-service gRPC surfaces.
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    pk.nust.cuas: DEBUG
