# auth-service — ARCHITECTURE.md sections 4.1.2, 7.3
#
# Issues and rotates tokens. Proves who a caller is; user-service decides what they may do.

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/authdb
    username: ${POSTGRES_USER:cuas}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: auth-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

server:
  port: 8081

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://cuas.nust.edu.pk/auth}
    audience: ${AUTH_JWT_AUDIENCE:cuas-api}
    # Section 7.3: 15-minute access token bounds the damage of a stolen one; the 7-day refresh
    # token is rotated on every use so a captured one is detectable.
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    # Base64 PKCS#8 RSA private key. Supplied by the secrets manager in deployed environments;
    # when absent an ephemeral key is generated and a warning is logged (development only).
    private-key: ${AUTH_JWT_PRIVATE_KEY:}
    key-id: ${AUTH_JWT_KEY_ID:}

  # Argon2id parameters from section 7.3. Do not lower these outside tests.
  argon2:
    memory-kb: 65536
    iterations: 3
    parallelism: 4

  lockout:
    max-failed-attempts: 5
    duration: PT15M

  mfa:
    challenge-ttl: PT5M

  cookie:
    # Must stay true anywhere the service is reachable over a network.
    secure: ${AUTH_COOKIE_SECURE:true}

  user-service:
    host: ${USER_SERVICE_HOST:localhost}
    port: ${USER_SERVICE_GRPC_PORT:9082}
    deadline-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    pk.nust.cuas: DEBUG
