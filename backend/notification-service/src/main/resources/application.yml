# notification-service — ARCHITECTURE.md section 4.1.9
#
# Consumes alert.raised.v1, alert.escalated.v1, incident.created.v1 and sensor.health.v1; delivers to
# each recipient's preferred channel with quiet-hours and severity gating, cross-channel deduplication
# and DB-backed retry with backoff; publishes notification.sent.v1 and notification.failed.v1. Owns
# notifydb. No Redis: the retry claim is FOR UPDATE SKIP LOCKED in Postgres.

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/notifydb
    username: ${POSTGRES_USER:cuas}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate validates against it and never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
      properties:
        max.poll.records: 200
        max.poll.interval.ms: 300000

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/jwks}

# Delivery tunables (see NotificationProperties). Left at their documented defaults here.
notification:
  retry:
    # Total attempts including the first, then it is terminal. Exponential backoff from the base,
    # doubling to the cap — a channel that is briefly down recovers without a storm of retries.
    max-attempts: 5
    base-backoff: PT10S
    max-backoff: PT5M
    sweep-batch: 100
    # The sweep interval and the lease a claimed retry holds. The lease is longer than the interval so
    # a slow sweep does not have its rows re-claimed under it; SKIP LOCKED makes concurrent sweeps safe.
    check-interval: PT15S
    lease: PT2M
    enabled: ${NOTIFICATION_RETRY_ENABLED:true}
  webhook:
    connect-timeout: PT3S
    read-timeout: PT5S

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    pk.nust.cuas: DEBUG
