# ai-orchestrator — test profile overrides.
#
# Integration tests supply Kafka through @DynamicPropertySource. Redis is not containerised for the
# orchestrator suite: the inference cache is optional by design — a permanent miss is correct
# behaviour — so the tests run against the no-op store and exercise the provider path every time.
# RedisInferenceCache has its own Testcontainers test.
ai:
  cache:
    enabled: false
  mock:
    # Assert on content, not elapsed time; the resilience tests enable latency where they need it.
    simulate-latency: false

logging:
  level:
    root: WARN
    pk.nust.cuas: INFO

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # The admin API is exercised through MockMvc with an injected JWT, so the key set is never
          # fetched; this URL is a placeholder that is never called.
          jwk-set-uri: http://localhost:59999/jwks

# Each integration test class gets its own cached Spring context in one JVM, and each would start a
# gRPC server. Port 0 binds an ephemeral port per context; a fixed port makes the second context fail
# with "address already in use" and takes the whole class down.
grpc:
  server:
    port: 0
