# ai-orchestrator — ARCHITECTURE.md sections 4.1.6, 6.1, 6.4
#
# The Track A / Track B boundary. It routes inference by sensor modality to whichever services are
# registered below, and reaches each one through the InferenceProvider port. It does not know what
# any of them model.

spring:
  application:
    name: ai-orchestrator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true

  # Content-addressed inference cache (section 4.1.6). Section 7.2 requires TLS + AUTH with a
  # per-service password in production; the password comes from the environment, never source.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  # The admin API is a resource server like every other operator-facing surface (section 7.2): its
  # two endpoints carry @PreAuthorize("hasAuthority('ai:configure')"), and SecurityConfig therefore
  # needs a JwtDecoder. This block was missing until M11 — the service had only ever been exercised
  # by sliced tests, which supply the key set through application-test.yml, so it could not start as
  # a container at all: "Method filterChain required a bean of type JwtDecoder that could not be
  # found." Nothing caught it because no test starts the whole context.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/jwks}

server:
  port: 8085

# The Infer endpoint track-correlation calls (sections 4.1.5, 4.1.6). Section 7.2 protects this
# surface with mTLS workload identity, as it does the other inter-service gRPC surfaces.
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9085}

# The AI service registry (section 6.1). Adding a model — radar fusion, acoustic, GNSS, anything —
# is a new block under `services` and nothing else: no orchestrator code changes, ever.
#
# **Deliberately empty here.** A default profile that shipped example services would register them
# in every deployment, including production — four mock-backed services nobody asked for, which is
# the config-level version of mistaking a mock for a real model. The registry is a deployment's own
# statement of what it runs. See application-dev.yml for a worked example of all four services from
# section 6.3.
ai:
  # Inference cache (section 4.1.6). A miss and an unreachable Redis are the same thing to the
  # caller, so a cache outage costs latency, never correctness. Set enabled=false to run without
  # Redis at all.
  cache:
    enabled: ${AI_CACHE_ENABLED:true}
    ttl: PT60S
  services: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    pk.nust.cuas: DEBUG
