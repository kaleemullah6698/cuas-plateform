# api-gateway — ARCHITECTURE.md sections 4.1.1, 7.3, 7.4, 7.8
#
# The gateway owns no domain data. Redis holds the section 7.8 token buckets and the section 7.3
# revocation denylist; Kafka carries the two telemetry streams of section 5.2.

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: "1"
      properties:
        # Edge telemetry must never hold up a request; a slow broker is dropped, not waited on.
        #
        # All four values are stated because Kafka validates them against each other:
        # delivery.timeout.ms must be >= linger.ms + request.timeout.ms. Setting only the delivery
        # timeout left request.timeout.ms at its 30 s default, so 5000 >= 0 + 30000 was false and
        # *every* producer construction threw
        #
        #   ConfigException: delivery.timeout.ms should be equal to or larger than
        #                    linger.ms + request.timeout.ms
        #
        # The gateway builds its producer lazily, per publish, so this did not fail at startup: it
        # failed on every access-log and rate-limit event, and the raw KafkaException escaped
        # RateLimitRejectionRecorder's AuditWriteException catch. A rate-limited request therefore
        # returned 500, and the error dispatch rendered that as a 401 — a refusal that looked like
        # a broken credential. Found by running the assembled platform (M11); no test constructs a
        # real producer.
        max.block.ms: 2000
        linger.ms: 0
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      # The WebSocket fan-out (§4.1.1): the gateway is a live edge, not a durable processor, so it
      # reads from `latest` — a restart resumes the live view rather than replaying history.
      group-id: ${GATEWAY_FANOUT_GROUP:api-gateway-fanout}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: latest
      properties:
        max.poll.records: 500

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

gateway:
  auth:
    # Cached, per section 4.1.2: the gateway never calls auth-service to validate a token.
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/jwks}
    issuer: ${AUTH_ISSUER:https://cuas.nust.edu.pk/auth}
    audience: ${AUTH_AUDIENCE:cuas-api}

  # X-Forwarded-For is believed only from these peers (section 7.8). Empty means never.
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

  cors:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:}

  access-log:
    # Section 4.1.1 samples the access stream. Rejections are always published regardless.
    sample-rate: ${GATEWAY_ACCESS_SAMPLE_RATE:0.1}

  # WebSocket fan-out (§3.5, §2.5.2). One multiplexed connection per session; the browser passes its
  # access token on the upgrade URL (it cannot set an Authorization header on a WS), validated by the
  # same JWKS decoder as every other request.
  ws:
    # Track/sensor deltas are coalesced latest-wins on this window (the §2.5.1 4 Hz console budget);
    # alerts bypass it and are pushed immediately.
    flush-interval-ms: ${GATEWAY_WS_FLUSH_MS:250}
    # Heartbeat cadence (§2.5.2: every 5s, client presumes dead at 15s).
    heartbeat-interval-ms: ${GATEWAY_WS_HEARTBEAT_MS:5000}
    # Concurrent connections per user; the oldest is closed when a sixth opens (§7 limits table).
    max-sessions-per-user: ${GATEWAY_WS_MAX_PER_USER:5}
    # Origins allowed to open the WS. Empty means none, so a deployment that forgets serves no browser.
    allowed-origins: ${GATEWAY_WS_ALLOWED_ORIGINS:}

  # Routing table (section 4.1.1). Every operator-facing API is served under /api/v1 and proxied
  # unchanged — a path in an access log, an audit record or a bug report means the same thing at
  # every hop. M11 completed the table: finding G-4 recorded that alert/incident/track/threat/
  # config/report/notification were reachable only by their bare service paths, which is why the
  # M10 console held those screens behind routing flags.
  routes:
    - id: auth-service
      uri: ${AUTH_SERVICE_URI:http://localhost:8081}
      prefixes:
        - /api/v1/auth
        # The JWKS document is fetched by every resource server, not by a browser, and its URL is
        # baked into their configuration. It keeps its own path.
        - /auth/jwks
    - id: user-service
      uri: ${USER_SERVICE_URI:http://localhost:8082}
      prefixes:
        - /api/v1/users
    - id: audit-service
      uri: ${AUDIT_SERVICE_URI:http://localhost:8090}
      prefixes:
        - /api/v1/audit
    - id: track-correlation
      uri: ${TRACK_SERVICE_URI:http://localhost:8084}
      prefixes:
        - /api/v1/tracks
    - id: threat-assessment
      uri: ${THREAT_SERVICE_URI:http://localhost:8086}
      prefixes:
        - /api/v1/threats
    - id: alert-service
      uri: ${ALERT_SERVICE_URI:http://localhost:8087}
      prefixes:
        - /api/v1/alerts
        - /api/v1/incidents
    - id: notification-service
      uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8088}
      prefixes:
        - /api/v1/notifications
    - id: reporting-service
      uri: ${REPORTING_SERVICE_URI:http://localhost:8089}
      prefixes:
        - /api/v1/reports
    - id: config-service
      uri: ${CONFIG_SERVICE_URI:http://localhost:8091}
      prefixes:
        - /api/v1/config
    - id: ai-orchestrator
      uri: ${AI_ORCHESTRATOR_URI:http://localhost:8085}
      prefixes:
        - /api/v1/ai/services

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Per-component detail is for the management surface, never for the public probe.
      show-details: when-authorized
  health:
    # Redis holds the rate-limit buckets and the denylist. Without it the gateway fails closed, so
    # an instance that cannot reach Redis must be taken out of rotation rather than serve 503s.
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    pk.nust.cuas: INFO
