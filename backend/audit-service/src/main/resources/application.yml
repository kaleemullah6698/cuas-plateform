# audit-service — ARCHITECTURE.md section 4.1.11
#
# Append-only, hash-chained tamper-evident audit log. Consumes platform.audit.v1 and calls no
# other service, so it can never become an availability dependency (section 4.2).

spring:
  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/auditdb
    username: ${POSTGRES_USER:cuas}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway. Hibernate validates against it and never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      # Offsets are committed only after the append transaction succeeds, so a crash mid-append
      # redelivers rather than silently losing the record.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          # Resolved lazily on first token validation, so this service starts independently of
          # auth-service and simply rejects tokens until the issuer is reachable.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/auth/jwks}

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    pk.nust.cuas: DEBUG
